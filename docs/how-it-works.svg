<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="882" viewBox="0 0 1400 882" role="img" aria-labelledby="title desc">
  <title id="title">How Session Lens works: what it reads, what it answers, what it never does</title>
  <desc id="desc">Session Lens reads Hermes' local records read-only and asks vendor usage endpoints with the credentials Hermes already holds (the one inference request is the Anthropic one-token probe). A GET-only API inside Hermes' backend serves normalized figures across a credential boundary to a native Desktop page, which answers eight questions: what each session cost and did, what allowance is left and who used it, which model gets the work done, whether the agent follows its instructions, what tools cost, whether the runtime is healthy, what the plugin touches, and how to take the numbers with you. It never writes, refreshes logins, reads cookies, sends session content, or guesses a number.</desc>
