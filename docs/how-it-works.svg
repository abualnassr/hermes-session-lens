  <rect width="1400" height="968" fill="#0b1016"/>

  <text x="40" y="50" class="h1">How Session Lens works</text>
  <text x="40" y="76" class="sub">What it reads, what it answers, and what it never does — read-only, inside Hermes Desktop.</text>
  <text x="40" y="98" class="sub"><tspan class="teal" font-weight="700">Teal</tspan> local reads &#160;·&#160; <tspan class="gold" font-weight="700">Gold</tspan> vendor usage endpoints, with the credential Hermes already holds &#160;·&#160; <tspan class="amber" font-weight="700">Amber</tspan> the one inference request &#160;·&#160; <tspan class="white" font-weight="700">White</tspan> answers on the page</text>

  <!-- ── left column: reads ────────────────────────────────────────── -->
  <text x="40" y="124" class="col teal">READS · LOCAL, READ-ONLY</text>
  <g fill="#101a22" stroke="#35c6c6" stroke-width="1.5">
    <rect x="40" y="136" width="310" height="50" rx="8"/>
    <rect x="40" y="192" width="310" height="50" rx="8"/>
    <rect x="40" y="248" width="310" height="50" rx="8"/>
    <rect x="40" y="304" width="310" height="50" rx="8"/>
    <rect x="40" y="360" width="310" height="50" rx="8"/>
    <rect x="40" y="416" width="310" height="50" rx="8"/>
  </g>
  <text x="56" y="157" class="t">Every profile's session store</text>
  <text x="56" y="176" class="s">state.db through SessionDB(read_only=True)</text>
  <text x="56" y="213" class="t">Agent logs — every API call</text>
  <text x="56" y="232" class="s">prompt, cache, output, latency per call · bounded</text>
  <text x="56" y="269" class="t">.env — key names only</text>
  <text x="56" y="288" class="s">which services exist · values stay with the adapter</text>
  <text x="56" y="325" class="t">config.yaml</text>
  <text x="56" y="344" class="s">mcp_servers · compression and helper-task settings</text>
  <text x="56" y="381" class="t">Hermes' own caches</text>
  <text x="56" y="400" class="s">MCP tool catalog · gateway state per profile</text>
  <text x="56" y="437" class="t">Hermes resolvers, pricing &amp; tool registry</text>
  <text x="56" y="456" class="s">credentials, prices, tool names — on Hermes' terms</text>

  <text x="40" y="496" class="col gold">ASKS · ONLY WHAT YOU'VE CONFIGURED</text>
  <g fill="#1c1a10" stroke="#e6b422" stroke-width="1.5">
    <rect x="40" y="508" width="310" height="82" rx="8"/>
    <rect x="40" y="598" width="310" height="98" rx="8"/>
  </g>
  <rect x="40" y="704" width="310" height="82" rx="8" fill="#1f170d" stroke="#f0a030" stroke-width="2"/>
  <text x="56" y="530" class="t">Model providers it can read</text>
  <text x="56" y="549" class="s">Codex, Nous, OpenRouter, DeepSeek,</text>
  <text x="56" y="565" class="s">Grok, Kimi, Z.AI, Anthropic</text>
  <text x="56" y="581" class="s">only the ones you've configured are asked</text>
  <text x="56" y="620" class="t">Services it can read</text>
  <text x="56" y="639" class="s">Firecrawl, ScrapeCreators, AgentMail, Bright Data,</text>
  <text x="56" y="655" class="s">Twilio, Voximplant, Context.dev, Vapi,</text>
  <text x="56" y="671" class="s">Reality Defender, Monid (through its local CLI)</text>
  <text x="56" y="687" class="s">the rest is listed, never contacted</text>
  <text x="56" y="726" class="t amber">Anthropic — one inference request</text>
  <text x="56" y="745" class="s">only when you hold a Claude credential;</text>
  <text x="56" y="761" class="s">a one-token message reads it · 15-min cache</text>
  <text x="56" y="777" class="s"><tspan class="mono">anthropic_usage_probe: false</tspan> turns it off</text>

  <!-- ── middle: Hermes Desktop ────────────────────────────────────── -->
  <rect x="470" y="120" width="480" height="666" rx="12" fill="none" stroke="#2a3644" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="488" y="143" class="col muted">HERMES DESKTOP</text>

  <rect x="490" y="156" width="440" height="210" rx="10" fill="#121a24" stroke="#3a4756" stroke-width="1.5"/>
  <text x="508" y="180" class="s12">Hermes backend (Python) · one backend for every profile</text>
  <rect x="510" y="196" width="400" height="152" rx="8" fill="#1c1a10" stroke="#e6b422" stroke-width="2"/>
  <text x="528" y="226" class="t2">Session Lens API</text>
  <text x="528" y="252" class="s12"><tspan class="mono">dashboard/plugin_api.py</tspan>, mounted in Hermes' backend</text>
  <text x="528" y="274" class="s12">GET routes only · 0 mutation routes</text>
  <text x="528" y="296" class="s12">each request scoped to its profile · caches kept per profile</text>
  <text x="528" y="318" class="s12">25-s time budget per view · nothing on disk</text>
  <text x="528" y="338" class="s12">subscription use counted as included, at list price beside it</text>

  <line x1="490" y1="402" x2="930" y2="402" stroke="#e8ecf1" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="632" y="390" width="156" height="22" rx="11" fill="#0b1016" stroke="#e8ecf1" stroke-width="1.2"/>
  <text x="710" y="405.5" class="tag" text-anchor="middle">CREDENTIAL BOUNDARY</text>
  <text x="710" y="430" class="s12" text-anchor="middle">figures and redacted snippets cross it · a token never does</text>

  <rect x="490" y="458" width="440" height="200" rx="10" fill="#121a24" stroke="#3a4756" stroke-width="1.5"/>
  <text x="508" y="488" class="t2">Session Lens page</text>
  <text x="508" y="514" class="s12"><tspan class="mono">desktop/plugin.js</tspan> · a native Hermes Desktop page</text>
  <text x="508" y="538" class="s2">Sessions · Overview · Fleet · Operations · Tools</text>
  <text x="508" y="558" class="s2">Rules · System · AI Usage · AI Models</text>
  <text x="508" y="584" class="s12">talks only to the API above · exports assembled here</text>
  <text x="508" y="604" class="s12">rules, budgets, alert rates stay in the desktop's storage</text>
  <text x="508" y="624" class="s12">a runaway session can raise one desktop notification</text>
  <text x="508" y="644" class="s12">a day, through Hermes' plugin notifications</text>

  <text x="710" y="740" class="s12" text-anchor="middle">one plugin, two halves — the page never holds a credential,</text>
  <text x="710" y="758" class="s12" text-anchor="middle">the backend never writes a file</text>

  <!-- ── right column: answers ─────────────────────────────────────── -->
  <text x="1000" y="124" class="col white">ANSWERS · ON THE PAGE</text>
  <g fill="#121a24" stroke="#3a4756" stroke-width="1.5">
    <rect x="1000" y="136" width="360" height="58" rx="8"/>
    <rect x="1000" y="202" width="360" height="58" rx="8"/>
