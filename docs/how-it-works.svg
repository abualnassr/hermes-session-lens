    .t2 { font-size: 17px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #9aa4b2; }
    .s12 { font-size: 12px; fill: #9aa4b2; }
    .s2 { font-size: 12.5px; fill: #e8ecf1; }
    .q { font-size: 13.5px; font-weight: 700; fill: #e6b422; }
    .tab { font-size: 11px; font-weight: 700; fill: #35c6c6; letter-spacing: 0.6px; }
    .tag { font-size: 11px; font-weight: 700; }
    .mono { font-family: Consolas, "Cascadia Mono", Menlo, monospace; }
    .teal { fill: #35c6c6; } .gold { fill: #e6b422; } .amber { fill: #f0a030; } .red { fill: #f26d6d; } .muted { fill: #9aa4b2; } .white { fill: #e8ecf1; }
  </style>
  <defs>
    <marker id="m-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#35c6c6"/></marker>
    <marker id="m-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6b422"/></marker>
    <marker id="m-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9d1da"/></marker>
  </defs>

  <rect width="1400" height="882" fill="#0b1016"/>

  <text x="40" y="50" class="h1">How Session Lens works</text>
  <text x="40" y="76" class="sub">What it reads, what it answers, and what it never does — read-only, inside Hermes Desktop.</text>
  <text x="40" y="98" class="sub"><tspan class="teal" font-weight="700">Teal</tspan> local reads &#160;·&#160; <tspan class="gold" font-weight="700">Gold</tspan> vendor usage endpoints, with the credential Hermes already holds &#160;·&#160; <tspan class="amber" font-weight="700">Amber</tspan> the one inference request &#160;·&#160; <tspan class="white" font-weight="700">White</tspan> answers on the page</text>

  <!-- ── left column: reads ────────────────────────────────────────── -->
  <text x="40" y="124" class="col teal">READS · LOCAL, READ-ONLY</text>
  <g fill="#101a22" stroke="#35c6c6" stroke-width="1.5">
    <rect x="40" y="136" width="310" height="50" rx="8"/>
    <rect x="40" y="192" width="310" height="50" rx="8"/>
    <rect x="40" y="248" width="310" height="50" rx="8"/>
    <rect x="40" y="304" width="310" height="50" rx="8"/>
    <rect x="40" y="360" width="310" height="50" rx="8"/>
  </g>
  <text x="56" y="157" class="t">Hermes session store</text>
  <text x="56" y="176" class="s">state.db through SessionDB(read_only=True)</text>
  <text x="56" y="213" class="t">Agent logs</text>
  <text x="56" y="232" class="s">latency, cache hits, tool durations · bounded</text>
  <text x="56" y="269" class="t">.env — key names only</text>
  <text x="56" y="288" class="s">which services exist · values stay with the adapter</text>
  <text x="56" y="325" class="t">config.yaml — mcp_servers</text>
  <text x="56" y="344" class="s">the MCP servers Hermes is configured with</text>
  <text x="56" y="381" class="t">Hermes resolvers &amp; tool registry</text>
  <text x="56" y="400" class="s">credentials and tool names, on Hermes' own terms</text>

  <text x="40" y="440" class="col gold">ASKS · ONLY WHAT YOU'VE CONFIGURED</text>
  <g fill="#1c1a10" stroke="#e6b422" stroke-width="1.5">
    <rect x="40" y="452" width="310" height="82" rx="8"/>
    <rect x="40" y="542" width="310" height="82" rx="8"/>
  </g>
  <rect x="40" y="632" width="310" height="82" rx="8" fill="#1f170d" stroke="#f0a030" stroke-width="2"/>
  <text x="56" y="474" class="t">Model providers it can read</text>
  <text x="56" y="493" class="s">Codex, Nous, OpenRouter, DeepSeek,</text>
  <text x="56" y="509" class="s">Grok, Kimi, Z.AI, Anthropic</text>
  <text x="56" y="525" class="s">only the ones you've configured are asked</text>
  <text x="56" y="564" class="t">Services it can read</text>
  <text x="56" y="583" class="s">Firecrawl, ScrapeCreators, AgentMail,</text>
  <text x="56" y="599" class="s">Bright Data, Monid (through its local CLI)</text>
  <text x="56" y="615" class="s">the rest is listed, never contacted</text>
  <text x="56" y="654" class="t amber">Anthropic — one inference request</text>
  <text x="56" y="673" class="s">only when you hold a Claude credential;</text>
  <text x="56" y="689" class="s">a one-token message reads it · 15-min cache</text>
  <text x="56" y="705" class="s"><tspan class="mono">anthropic_usage_probe: false</tspan> turns it off</text>

  <!-- ── middle: Hermes Desktop ────────────────────────────────────── -->
  <rect x="470" y="120" width="480" height="594" rx="12" fill="none" stroke="#2a3644" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="488" y="143" class="col muted">HERMES DESKTOP</text>

  <rect x="490" y="156" width="440" height="180" rx="10" fill="#121a24" stroke="#3a4756" stroke-width="1.5"/>
  <text x="508" y="180" class="s12">Hermes backend (Python)</text>
  <rect x="510" y="196" width="400" height="122" rx="8" fill="#1c1a10" stroke="#e6b422" stroke-width="2"/>
  <text x="528" y="226" class="t2">Session Lens API</text>
  <text x="528" y="252" class="s12"><tspan class="mono">dashboard/plugin_api.py</tspan>, mounted in Hermes' backend</text>
  <text x="528" y="274" class="s12">GET routes only · 0 mutation routes</text>
  <text x="528" y="296" class="s12">5-min usage cache · 60-s models cache · nothing on disk</text>

  <line x1="490" y1="372" x2="930" y2="372" stroke="#e8ecf1" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="632" y="360" width="156" height="22" rx="11" fill="#0b1016" stroke="#e8ecf1" stroke-width="1.2"/>
  <text x="710" y="375.5" class="tag" text-anchor="middle">CREDENTIAL BOUNDARY</text>
  <text x="710" y="400" class="s12" text-anchor="middle">figures and redacted snippets cross it · a token never does</text>

  <rect x="490" y="430" width="440" height="156" rx="10" fill="#121a24" stroke="#3a4756" stroke-width="1.5"/>
  <text x="508" y="460" class="t2">Session Lens page</text>
  <text x="508" y="486" class="s12"><tspan class="mono">desktop/plugin.js</tspan> · a native Hermes Desktop page</text>
  <text x="508" y="508" class="s2">Sessions · Overview · Operations · Tools · Rules</text>
  <text x="508" y="528" class="s2">System · AI Usage · AI Models</text>
  <text x="508" y="552" class="s12">talks only to the API above · exports assembled here</text>
  <text x="508" y="570" class="s12">rules, budgets, dismissals stay in the desktop's storage</text>

  <text x="710" y="672" class="s12" text-anchor="middle">one plugin, two halves — the page never holds a credential,</text>
  <text x="710" y="690" class="s12" text-anchor="middle">the backend never writes a file</text>

  <!-- ── right column: answers ─────────────────────────────────────── -->
  <text x="1000" y="124" class="col white">ANSWERS · ON THE PAGE</text>
  <g fill="#121a24" stroke="#3a4756" stroke-width="1.5">
    <rect x="1000" y="136" width="360" height="58" rx="8"/>
    <rect x="1000" y="202" width="360" height="58" rx="8"/>
    <rect x="1000" y="268" width="360" height="58" rx="8"/>
    <rect x="1000" y="334" width="360" height="58" rx="8"/>
    <rect x="1000" y="400" width="360" height="58" rx="8"/>
    <rect x="1000" y="466" width="360" height="58" rx="8"/>
    <rect x="1000" y="532" width="360" height="58" rx="8"/>
    <rect x="1000" y="598" width="360" height="58" rx="8"/>
  </g>
  <text x="1016" y="159" class="q">What did each session cost, and do?</text>
  <text x="1016" y="180" class="tab">◆ SESSIONS · OVERVIEW · TRACE</text>
  <text x="1016" y="225" class="q">What do I have left, and who used it?</text>
  <text x="1016" y="246" class="tab">◆ AI USAGE · BUDGETS · SERVICES</text>
  <text x="1016" y="291" class="q">Which model actually gets the work done?</text>
  <text x="1016" y="312" class="tab">◆ AI MODELS</text>
  <text x="1016" y="357" class="q">Does my agent follow its instructions?</text>
  <text x="1016" y="378" class="tab">◆ RULES</text>
  <text x="1016" y="423" class="q">What do my tools and MCP servers cost?</text>
  <text x="1016" y="444" class="tab">◆ TOOLS</text>
  <text x="1016" y="489" class="q">Is the runtime healthy?</text>
  <text x="1016" y="510" class="tab">◆ OPERATIONS · SCHEDULES</text>
  <text x="1016" y="555" class="q">What does the plugin touch?</text>
  <text x="1016" y="576" class="tab">◆ SYSTEM</text>
  <text x="1016" y="621" class="q">Can I take the numbers with me?</text>
  <text x="1016" y="642" class="tab">◆ EXPORT · DIGEST API</text>

  <!-- ── connectors (behind boxes) ─────────────────────────────────── -->
  <!-- teal bus: local reads into the API -->
  <g stroke="#35c6c6" stroke-width="1.6" fill="none">
    <line x1="350" y1="161" x2="390" y2="161"/>
    <line x1="350" y1="217" x2="390" y2="217"/>
    <line x1="350" y1="273" x2="390" y2="273"/>
    <line x1="350" y1="329" x2="390" y2="329"/>
    <line x1="350" y1="385" x2="390" y2="385"/>
    <line x1="390" y1="161" x2="390" y2="385"/>
    <line x1="390" y1="236" x2="510" y2="236" stroke-width="2.2" marker-end="url(#m-teal)"/>
  </g>
  <text x="450" y="226" class="tag teal" text-anchor="middle">read-only</text>

  <!-- gold/amber bus: vendor endpoints into the API -->
  <g stroke="#e6b422" stroke-width="1.6" fill="none">
    <line x1="350" y1="493" x2="410" y2="493"/>
    <line x1="350" y1="583" x2="410" y2="583"/>
    <line x1="410" y1="290" x2="410" y2="583"/>
    <line x1="410" y1="290" x2="510" y2="290" stroke-width="2.2" marker-end="url(#m-gold)"/>
  </g>
  <g stroke="#f0a030" stroke-width="1.6" fill="none">
    <line x1="410" y1="583" x2="410" y2="673"/>
    <line x1="350" y1="673" x2="410" y2="673"/>
  </g>
  <text x="460" y="306" class="tag gold" text-anchor="middle">outbound</text>

  <!-- API to page, across the credential boundary -->
  <line x1="710" y1="318" x2="710" y2="428" stroke="#e6b422" stroke-width="2.2" fill="none" marker-end="url(#m-gold)"/>

  <!-- white bus: page out to the answers -->
  <g stroke="#c9d1da" stroke-width="1.4" fill="none">
    <line x1="930" y1="508" x2="965" y2="508" stroke-width="2"/>
    <line x1="965" y1="165" x2="965" y2="627"/>
    <line x1="965" y1="165" x2="1000" y2="165" marker-end="url(#m-white)"/>
    <line x1="965" y1="231" x2="1000" y2="231" marker-end="url(#m-white)"/>
    <line x1="965" y1="297" x2="1000" y2="297" marker-end="url(#m-white)"/>
    <line x1="965" y1="363" x2="1000" y2="363" marker-end="url(#m-white)"/>
    <line x1="965" y1="429" x2="1000" y2="429" marker-end="url(#m-white)"/>
    <line x1="965" y1="495" x2="1000" y2="495" marker-end="url(#m-white)"/>
    <line x1="965" y1="561" x2="1000" y2="561" marker-end="url(#m-white)"/>
    <line x1="965" y1="627" x2="1000" y2="627" marker-end="url(#m-white)"/>
  </g>

  <!-- ── bottom strip: never ───────────────────────────────────────── -->
  <text x="40" y="748" class="col red">NEVER</text>
  <g fill="#171216" stroke="#5a2c33" stroke-width="1.5">
    <rect x="40" y="762" width="252" height="82" rx="8"/>
    <rect x="307" y="762" width="252" height="82" rx="8"/>
    <rect x="574" y="762" width="252" height="82" rx="8"/>
    <rect x="841" y="762" width="252" height="82" rx="8"/>
    <rect x="1108" y="762" width="252" height="82" rx="8"/>
  </g>
  <text x="56" y="788" class="t">Writes nothing</text>
  <text x="56" y="809" class="s12">no cache file, no export file,</text>
  <text x="56" y="827" class="s12">no config edit, no session change</text>
  <text x="323" y="788" class="t">Refreshes no login</text>
  <text x="323" y="809" class="s12">an expired Anthropic login is</text>
  <text x="323" y="827" class="s12">reported as expired, not renewed</text>
  <text x="590" y="788" class="t">Reads no browser cookies</text>
  <text x="590" y="809" class="s12">and no credential file outside</text>
  <text x="590" y="827" class="s12 mono">$HERMES_HOME</text>
  <text x="857" y="788" class="t">Sends no session content</text>
  <text x="857" y="809" class="s12">no prompts, no telemetry,</text>
  <text x="857" y="827" class="s12">to any service, ever</text>
  <text x="1124" y="788" class="t">Guesses no number</text>
  <text x="1124" y="809" class="s12">unpriced, unknown, not rankable</text>
  <text x="1124" y="827" class="s12">are said out loud</text>

  <text x="1360" y="870" class="s12" text-anchor="end">hermes-session-lens · verify with GET /adapters, GET /system, and the test suite</text>
</svg>
