  </g>
  <text x="1016" y="159" class="q">What did each session cost — and why?</text>
  <text x="1016" y="180" class="tab">◆ SESSIONS · WHY IT COST · TRACE</text>
  <text x="1016" y="225" class="q">What is running now, and how fast?</text>
  <text x="1016" y="246" class="tab">◆ OVERVIEW · RUNNING NOW · ALERTS</text>
  <text x="1016" y="291" class="q">Is every agent profile alive and healthy?</text>
  <text x="1016" y="312" class="tab">◆ FLEET · OPERATIONS · SCHEDULES</text>
  <text x="1016" y="357" class="q">What do I have left, and who used it?</text>
  <text x="1016" y="378" class="tab">◆ AI USAGE · BUDGETS · SERVICES</text>
  <text x="1016" y="423" class="q">Which model does the work — and cheaper?</text>
  <text x="1016" y="444" class="tab">◆ AI MODELS · CHEAPER ROUTES</text>
  <text x="1016" y="489" class="q">What keeps failing?</text>
  <text x="1016" y="510" class="tab">◆ TOOLS · RECURRING FAILURES</text>
  <text x="1016" y="555" class="q">What do my tools and MCP servers cost?</text>
  <text x="1016" y="576" class="tab">◆ TOOLS · EVERY CONNECTED SERVER</text>
  <text x="1016" y="621" class="q">What did a whole conversation cost?</text>
  <text x="1016" y="642" class="tab">◆ OVERVIEW · CONVERSATIONS · HELPER TASKS</text>
  <text x="1016" y="687" class="q">Does my agent follow its instructions?</text>
  <text x="1016" y="708" class="tab">◆ RULES</text>
  <text x="1016" y="753" class="q">What does the plugin touch — and export?</text>
  <text x="1016" y="774" class="tab">◆ SYSTEM · EXPORT · DIGEST API</text>

