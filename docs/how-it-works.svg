  <!-- ── bottom strip: never ───────────────────────────────────────── -->
  <text x="40" y="830" class="col red">NEVER</text>
  <g fill="#171216" stroke="#5a2c33" stroke-width="1.5">
    <rect x="40" y="844" width="252" height="82" rx="8"/>
    <rect x="307" y="844" width="252" height="82" rx="8"/>
    <rect x="574" y="844" width="252" height="82" rx="8"/>
    <rect x="841" y="844" width="252" height="82" rx="8"/>
    <rect x="1108" y="844" width="252" height="82" rx="8"/>
  </g>
  <text x="56" y="870" class="t">Writes nothing</text>
  <text x="56" y="891" class="s12">no cache file, no export file,</text>
  <text x="56" y="909" class="s12">no config edit, no session change</text>
  <text x="323" y="870" class="t">Refreshes no login</text>
  <text x="323" y="891" class="s12">an expired Anthropic login is</text>
  <text x="323" y="909" class="s12">reported as expired, not renewed</text>
  <text x="590" y="870" class="t">Reads no browser cookies</text>
  <text x="590" y="891" class="s12">and no credential file outside</text>
  <text x="590" y="909" class="s12 mono">$HERMES_HOME</text>
  <text x="857" y="870" class="t">Sends no session content</text>
  <text x="857" y="891" class="s12">no prompts, no telemetry,</text>
  <text x="857" y="909" class="s12">to any service, ever</text>
  <text x="1124" y="870" class="t">Guesses no number</text>
  <text x="1124" y="891" class="s12">unpriced, unknown, not rankable,</text>
  <text x="1124" y="909" class="s12">not enough evidence — said out loud</text>

  <text x="1360" y="952" class="s12" text-anchor="end">hermes-session-lens · verify with GET /adapters, GET /system, and the test suite</text>
</svg>
