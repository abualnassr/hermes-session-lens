<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="968" viewBox="0 0 1400 968" role="img" aria-labelledby="title desc">
  <title id="title">How Session Lens works: what it reads, what it answers, what it never does</title>
  <desc id="desc">Session Lens reads Hermes' local records read-only — every profile's session store, the agent logs' per-call figures, key names, config settings, and Hermes' own caches and resolvers — and asks vendor usage endpoints with the credentials Hermes already holds (the one inference request is the Anthropic one-token probe). A GET-only API inside Hermes' single backend, scoped per request to the active profile, serves normalized figures across a credential boundary to a native Desktop page, which answers ten questions: what each session cost and why, what is running and how fast it burns, whether every profile is healthy, what allowance is left and who used it, which model does the work and whether a cheaper one would, what keeps failing, what tools and MCP servers cost, what a whole conversation cost, whether the agent follows its instructions, and what the plugin touches. It never writes, refreshes logins, reads cookies, sends session content, or guesses a number.</desc>
