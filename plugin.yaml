manifest_version: 2
api_version: 1
name: session-lens
label: Hermes Session Lens
version: 0.22.0
description: "Native Hermes Desktop observability: session trace, cost, provider usage, runtime health, profiles, and schedules."
author: "Hermes Session Lens contributors"
kind: standalone
license: MIT
tags:
  - desktop
  - analytics
  - observability
  - sessions
config_schema:
  rate_sample_threshold:
    type: int
    default: 20
    description: "Minimum sample count before fail and retry/switch rates receive threshold colors or percentage sorting rank."
  model_route_mappings:
    type: dict
    default: {}
    description: "Optional model-id glob to route-label overrides; for example, gpt-5.6-*: OpenAI OAuth."
