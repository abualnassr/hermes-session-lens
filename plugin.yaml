manifest_version: 2
api_version: 1
name: session-lens
label: Hermes Session Lens
version: 0.53.2
description: "Native Hermes Desktop observability: session trace, cost, provider usage, runtime health, profiles, and schedules."
author: "Hermes Session Lens contributors"
kind: standalone
license: MIT
requires_hermes: ">=0.21.5"
tags:
  - desktop
  - analytics
  - observability
  - sessions
config_schema:
  rate_sample_threshold:
    type: int
    default: 20
    description: "Minimum sample count before fail and retry/switch rates receive threshold colors or percentage sorting rank."
  model_route_mappings:
    type: dict
    default: {}
    description: "Optional model-id glob to route-label overrides; for example, gpt-5.6-*: OpenAI OAuth."
  route_budget_seconds:
    type: int
    default: 25
    description: "Seconds one Session Lens view may spend building its data before the backend stops it and the view shows why. Keeps Hermes responsive when a scope is too heavy. 0 disables the budget."
  anthropic_usage_probe:
    type: bool
    default: false
    description: "Off by default. Set true to read Anthropic allowances from the rate-limit headers of a one-token Claude Haiku message per credential (cached 15 minutes). While off, setup tokens and API keys show Not configured; full OAuth logins are still read from the usage endpoint."
